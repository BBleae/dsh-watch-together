name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    # Windows, because every package declares "os": ["win32"]. On Linux pnpm
    # reports "Unsupported platform" for each of them and skips the install,
    # which reads like a broken lockfile rather than a wrong runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # No "version" here on purpose: package.json declares
      # "packageManager": "pnpm@11.28.5", and pnpm/action-setup REFUSES to run
      # when both are present ("Multiple versions of pnpm specified"). Letting
      # the packageManager field be the single source of truth keeps CI and a
      # local install on the same pnpm.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # pnpm 11 skips dependency build scripts by default and exits 1 when it
      # skipped any - which turned "the install worked" into a red run, before
      # the publish step was ever reached. Allowing builds here is safe: the only
      # one in the tree is msedge-tts's "only-allow pnpm" guard.
      - run: pnpm install --frozen-lockfile=false --config.dangerouslyAllowAllBuilds=true

      # pnpm publish rewrites the meta package's "workspace:*" dependencies into
      # real version numbers, which npm publish does NOT do. Siblings first, meta
      # last: the meta package declares them, so publishing it before they exist
      # leaves npm with an unresolvable version. npm refuses a duplicate version,
      # which makes a re-run after a partial publish pick up only what is missing.
      - name: publish services
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSHWATCHTOGETHER }}
        run: |
          for p in dsh-watch-eyes dsh-watch-ears dsh-watch-mouth \
                   dsh-watch-browser dsh-watch-hands dsh-watch-panel; do
            echo "::group::$p"
            pnpm --filter $p publish --access public --no-git-checks
            echo "::endgroup::"
          done

      - name: publish meta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSHWATCHTOGETHER }}
        run: pnpm publish --access public --no-git-checks
